<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 612 792" preserveAspectRatio="none" xml:space="preserve" style="position:absolute;left:0;top:0;width:100%;height:100%;white-space:pre" fill="#000">
<text x="46" y="49.67" font-size="9" textLength="182.89" lengthAdjust="spacingAndGlyphs" font-family="'HelveticaNeue', sans-serif" font-weight="315" fill="#231f20">National Aeronautics and Space Administration</text>
<text x="551.66" y="716.59" font-size="48" textLength="322.34" lengthAdjust="spacingAndGlyphs" transform="rotate(-90 551.66 716.59)" font-family="'HelveticaNeue', sans-serif" font-weight="190" fill="#a2cf62">training for space</text>
<text x="45" y="139.07" font-size="12" textLength="116.5" lengthAdjust="spacingAndGlyphs" font-family="'HelveticaNeue', sans-serif" font-weight="420" fill="#231f20">Johnson Space Center</text>
<text x="45" y="164.07" font-size="24" textLength="180" lengthAdjust="spacingAndGlyphs" font-family="'HelveticaNeue', sans-serif" font-weight="860" fill="#a2cf62">Training for space</text>
<text x="45" y="183.07" font-size="11" textLength="178.96" lengthAdjust="spacingAndGlyphs" font-family="'HelveticaNeue', sans-serif" font-weight="420" font-style="italic" fill="#231f20">Astronaut training and mission preparation</text>
<text x="45" y="241.2" font-size="10" textLength="362.95" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">Johnson Space Center is home to the nation’s astronaut corps and is responsible for preparing</text>
<text x="45" y="257.2" font-size="10" textLength="379.98" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">explorers from both the U.S. and its international partners for the demands of living and working</text>
<text x="45" y="273.2" font-size="10" textLength="385.53" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">in space. The first U.S. astronauts were selected in 1959. Since then, 321 U.S. astronauts and more</text>
<text x="45" y="289.2" font-size="10" textLength="382.74" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">than 50 explorers from other nations have been trained at the center. About 240 men and women,</text>
<text x="45" y="305.2" font-size="10" textLength="347.6" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">including 130 international astronauts, with primarily engineering, scientific and military</text>
<text x="319.5" y="321.2" font-size="10" textLength="85.51" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">backgrounds make up</text>
<text x="319.5" y="337.2" font-size="10" textLength="92.68" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">NASA's astronaut corps</text>
<text x="319.5" y="353.2" font-size="10" textLength="23.09" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">today.</text>
<text x="333" y="369.2" font-size="10" textLength="68.2" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">At Johnson Space</text>
<text x="319.5" y="385.2" font-size="10" textLength="104.21" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">Center, potential astronaut</text>
<text x="319.51" y="401.2" font-size="10" textLength="103.62" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">candidates undergo one of</text>
<text x="319.51" y="417.2" font-size="10" textLength="111.71" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">the world’s most competitive</text>
<text x="319.51" y="433.2" font-size="10" textLength="107.45" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">selection processes. Selected</text>
<text x="319.51" y="449.2" font-size="10" textLength="98.53" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">candidates then complete</text>
<text x="319.51" y="465.2" font-size="10" textLength="105.48" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">approximately two years of</text>
<text x="319.51" y="481.2" font-size="10" textLength="94.06" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">intensive training before</text>
<text x="319.51" y="497.2" font-size="10" textLength="82.19" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">beginning specialized</text>
<text x="319.51" y="513.2" font-size="10" textLength="108.28" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">mission training. Only then</text>
<text x="319.51" y="529.2" font-size="10" textLength="91.73" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">do astronaut candidates</text>
<text x="319.51" y="545.2" font-size="10" textLength="103.85" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">become eligible for a flight</text>
<text x="319.47" y="561.2" font-size="10" textLength="97.4" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">assignment. During their</text>
<text x="319.47" y="577.2" font-size="10" textLength="92.52" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">classroom “boot camp,”</text>
<text x="319.47" y="593.2" font-size="10" textLength="101.24" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">candidates are schooled in</text>
<text x="45.01" y="609.2" font-size="10" textLength="384.03" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">shuttle and space station systems along with a variety of other disciplines, including Earth sciences,</text>
<text x="45.01" y="625.2" font-size="10" textLength="366.32" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">meteorology, space science and engineering. They also train in land and water survival, aircraft</text>
<text x="45.01" y="641.2" font-size="10" textLength="111.01" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">operations and scuba diving.</text>
<text x="58.14" y="657.2" font-size="10" textLength="336.77" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">Once the candidate training period is complete, new astronauts are given their mission</text>
<text x="45" y="673.2" font-size="10" textLength="357.6" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">assignment and grouped with experienced astronauts to continue training. The two types of</text>
<text x="45" y="689.2" font-size="10" textLength="356.29" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">astronauts – pilots and mission specialists – perform different functions: pilot astronauts are</text>
<text x="45" y="705.2" font-size="10" textLength="376.31" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">assigned to fly the shuttle and command missions, and mission specialists are the flight engineers</text>
</svg>

<div class="pdf-page" id="page-2" style="position:relative;overflow:hidden;width:612pt;max-width:100%;aspect-ratio:612/792;background:#ffffff;page:pdf-612x792">
<img src="background_2.png" alt="" loading="lazy" decoding="async" draggable="false" style="position:absolute;left:0;top:0;width:100%;height:100%;user-select:none">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 612 792" preserveAspectRatio="none" xml:space="preserve" style="position:absolute;left:0;top:0;width:100%;height:100%;white-space:pre" fill="#000">
<text x="46" y="88.2" font-size="10" textLength="229.42" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">assigned to conduct spacewalks, perform robotics tasks and</text>
<text x="46" y="104.2" font-size="10" textLength="104.34" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">conduct scientific research.</text>
<text x="59.14" y="120.2" font-size="10" textLength="219.62" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">A new group of astronauts, comprised of educators from</text>
<text x="46" y="136.2" font-size="10" textLength="245.47" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">all corners of the U.S., is undergoing training at Johnson Space</text>
<text x="46" y="152.2" font-size="10" textLength="241.02" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">Center for future missions. The educator astronauts will bring</text>
<text x="46" y="168.2" font-size="10" textLength="232.43" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">the excitement of human spaceflight to a new generation of</text>
<text x="46" y="184.2" font-size="10" textLength="36.91" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">explorers.</text>
<text x="46.52" y="54.57" font-size="12" textLength="100.94" lengthAdjust="spacingAndGlyphs" font-family="'HelveticaNeue', sans-serif" font-weight="690" fill="#231f20">Training for space</text>
<text x="156.38" y="54.57" font-size="11" textLength="178.96" lengthAdjust="spacingAndGlyphs" font-family="'HelveticaNeue', sans-serif" font-weight="420" font-style="italic" fill="#231f20">Astronaut training and mission preparation</text>
<text x="46" y="206.77" font-size="11" textLength="75.32" lengthAdjust="spacingAndGlyphs" font-family="'HelveticaNeue', sans-serif" font-weight="690" fill="#231f20">Training facilities</text>
<text x="46" y="222.77" font-size="10" textLength="227.85" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">Designing a training program to prepare astronauts for the</text>
<text x="46" y="238.77" font-size="10" textLength="239.15" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">uniqueness of working in microgravity presents its own set of</text>
<text x="46" y="254.77" font-size="10" textLength="237.3" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">challenges. Trainers must not only familiarize astronauts with</text>
<text x="46" y="270.77" font-size="10" textLength="239.94" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">complex and highly specialized flight vehicles, equipment and</text>
<text x="46" y="286.77" font-size="10" textLength="228.8" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">suits, but must do it in a way that simulates a microgravity</text>
<text x="46" y="302.77" font-size="10" textLength="86.7" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">working environment.</text>
<text x="46" y="324.69" font-size="10" textLength="44.6" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="650" font-style="italic" fill="#231f20">Simulators</text>
<text x="46" y="340.69" font-size="10" textLength="217" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">Highly realistic mockups, housed in both the Jake Garn</text>
<text x="46" y="356.69" font-size="10" textLength="232.4" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">Training Facility and the Space Vehicle Mockup Facility, are</text>
<text x="46" y="372.69" font-size="10" textLength="220.29" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">used to train astronauts in vehicle operations. Astronauts</text>
<text x="46" y="388.69" font-size="10" textLength="235.5" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">prepare for launch, landing, payload and International Space</text>
<text x="46" y="404.69" font-size="10" textLength="249.96" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">Station operations and rendezvous activities in the Garn Facility.</text>
<text x="46" y="420.69" font-size="10" textLength="250.22" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">A motion­based trainer simulates the vibrations, noise and views</text>
<text x="46" y="436.69" font-size="10" textLength="244.35" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">the astronauts experience during shuttle launch and landing. A</text>
<text x="46" y="452.69" font-size="10" textLength="215.33" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">fixed­base simulator is used for rendezvous and payload</text>
<text x="46" y="468.69" font-size="10" textLength="241.95" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">operations training, and a functional space station simulator is</text>
<text x="46" y="484.69" font-size="10" textLength="238.63" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">used to train astronauts in the use of the on­orbit laboratory’s</text>
<text x="46" y="500.69" font-size="10" textLength="230.21" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">systems. The Space Vehicle Mockup Facility is home to full</text>
<text x="46" y="516.69" font-size="10" textLength="249.45" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">sized mockups of the shuttle’s flight deck and mid­deck and one</text>
<text x="46" y="532.69" font-size="10" textLength="233.48" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">full­sized shuttle mockup. Station mockups of the complex’s</text>
<text x="46" y="548.69" font-size="10" textLength="246.6" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">different habitable elements help familiarize astronauts with the</text>
<text x="46" y="564.69" font-size="10" textLength="237.79" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">station’s layout. Before their first mission, astronauts typically</text>
<text x="46" y="580.69" font-size="10" textLength="230.89" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">train for a combined total of 300 hours in these simulators.</text>
<text x="314.7" y="88.2" font-size="10" textLength="241.44" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">Astronauts preparing for spacewalks or robotic arm operations</text>
<text x="314.7" y="104.2" font-size="10" textLength="213.92" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">test their skills in the Virtual Reality Laboratory, which</text>
<text x="314.7" y="120.2" font-size="10" textLength="208.2" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">immerses them in a computer­generated microgravity</text>
<text x="314.7" y="136.2" font-size="10" textLength="52.12" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">environment.</text>
<text x="314.7" y="158.12" font-size="10" textLength="127.4" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="650" font-style="italic" fill="#231f20">Sonny Carter Training Facility</text>
<text x="314.7" y="174.12" font-size="10" textLength="211.99" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">The world’s largest indoor pool, the Neutral Buoyancy</text>
<text x="314.7" y="190.12" font-size="10" textLength="213.33" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">Laboratory – housed within the Sonny Carter Training</text>
<text x="314.7" y="206.12" font-size="10" textLength="237.75" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">Facility – holds 6.2 million gallons of water and is more than</text>
<text x="314.7" y="222.12" font-size="10" textLength="236.22" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">200 feet long and 40 feet deep. Deep within the pool, which</text>
<text x="314.7" y="238.12" font-size="10" textLength="243.24" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">simulates the weightless environment of space, astronauts train</text>
<text x="314.7" y="254.12" font-size="10" textLength="237.25" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">for spacewalks on full­sized replicas of space station modules.</text>
<text x="314.7" y="270.12" font-size="10" textLength="247.37" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">They spend approximately 10 hours under water for every hour</text>
<text x="314.7" y="286.12" font-size="10" textLength="110.99" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">they spend walking in space.</text>
<text x="314.7" y="308.04" font-size="10" textLength="69.23" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="650" font-style="italic" fill="#231f20">Aircraft training</text>
<text x="314.7" y="324.04" font-size="10" textLength="241.03" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">Pilot astronauts train in a Gulfstream jet aircraft that has been</text>
<text x="314.7" y="340.04" font-size="10" textLength="235.78" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">specially modified to mimic the approach and landing of the</text>
<text x="314.7" y="356.04" font-size="10" textLength="249.74" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">space shuttle. This jet provides a unique training experience that</text>
<text x="314.7" y="372.04" font-size="10" textLength="239.06" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">helps prepare astronauts for the spacecraft’s runway approach,</text>
<text x="314.7" y="388.04" font-size="10" textLength="237.66" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">which is nearly seven times steeper than that of a commercial</text>
<text x="314.7" y="404.04" font-size="10" textLength="223.98" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">airliner. Pilots will fly more than 1,000 approaches in this</text>
<text x="314.7" y="420.04" font-size="10" textLength="237.6" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">aircraft before ever landing the shuttle. All astronauts train in</text>
<text x="314.7" y="436.04" font-size="10" textLength="239.1" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">T­38 jets learning flight techniques and cockpit management.</text>
<text x="327.84" y="452.04" font-size="10" textLength="231.09" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">To learn more about astronaut training and NASA Johnson</text>
<text x="314.7" y="468.04" font-size="10" textLength="213.13" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">Space Center’s training facilities, visit us on the Web at</text>
<text x="314.7" y="484.04" font-size="11" textLength="128.73" lengthAdjust="spacingAndGlyphs" font-family="'HelveticaNeue', sans-serif" font-weight="420" font-style="italic" fill="#231f20">www.nasa.gov/centers/johnson</text>
<text x="445.47" y="484.04" font-size="10" textLength="14.38" lengthAdjust="spacingAndGlyphs" font-family="'AGaramond', serif" font-weight="370" fill="#231f20">and</text>
<text x="314.7" y="510.04" font-size="14" textLength="85.55" lengthAdjust="spacingAndGlyphs" font-family="'HelveticaNeue', sans-serif" font-weight="690" font-style="italic" fill="#a2cf62">www.nasa.gov</text>
<text x="46" y="774.11" font-size="6" textLength="56.57" lengthAdjust="spacingAndGlyphs" font-family="'Helvetica', sans-serif" font-weight="440" fill="#231f20">FS­2006­03­011­JSC</text>
