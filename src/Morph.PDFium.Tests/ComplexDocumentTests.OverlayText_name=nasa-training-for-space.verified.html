<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 612 792" preserveAspectRatio="none" xml:space="preserve" style="position:absolute;left:0;top:0;width:100%;height:100%;white-space:pre" class="pdf-overlay" fill="transparent" font-family="sans-serif">
<text x="46" y="49.67" font-size="9" textLength="182.89" lengthAdjust="spacingAndGlyphs">National Aeronautics and Space Administration</text>
<text x="551.66" y="716.59" font-size="48" textLength="322.34" lengthAdjust="spacingAndGlyphs" transform="rotate(-90 551.66 716.59)">training for space</text>
<text x="45" y="139.07" font-size="12" textLength="116.5" lengthAdjust="spacingAndGlyphs">Johnson Space Center</text>
<text x="45" y="164.07" font-size="24" textLength="180" lengthAdjust="spacingAndGlyphs">Training for space</text>
<text x="45" y="183.07" font-size="11" textLength="178.96" lengthAdjust="spacingAndGlyphs">Astronaut training and mission preparation</text>
<text x="45" y="241.2" font-size="10" textLength="362.95" lengthAdjust="spacingAndGlyphs">Johnson Space Center is home to the nation’s astronaut corps and is responsible for preparing</text>
<text x="45" y="257.2" font-size="10" textLength="379.98" lengthAdjust="spacingAndGlyphs">explorers from both the U.S. and its international partners for the demands of living and working</text>
<text x="45" y="273.2" font-size="10" textLength="385.53" lengthAdjust="spacingAndGlyphs">in space. The first U.S. astronauts were selected in 1959. Since then, 321 U.S. astronauts and more</text>
<text x="45" y="289.2" font-size="10" textLength="382.74" lengthAdjust="spacingAndGlyphs">than 50 explorers from other nations have been trained at the center. About 240 men and women,</text>
<text x="45" y="305.2" font-size="10" textLength="347.6" lengthAdjust="spacingAndGlyphs">including 130 international astronauts, with primarily engineering, scientific and military</text>
<text x="319.5" y="321.2" font-size="10" textLength="85.51" lengthAdjust="spacingAndGlyphs">backgrounds make up</text>
<text x="319.5" y="337.2" font-size="10" textLength="92.68" lengthAdjust="spacingAndGlyphs">NASA's astronaut corps</text>
<text x="319.5" y="353.2" font-size="10" textLength="23.09" lengthAdjust="spacingAndGlyphs">today.</text>
<text x="333" y="369.2" font-size="10" textLength="68.2" lengthAdjust="spacingAndGlyphs">At Johnson Space</text>
<text x="319.5" y="385.2" font-size="10" textLength="104.21" lengthAdjust="spacingAndGlyphs">Center, potential astronaut</text>
<text x="319.51" y="401.2" font-size="10" textLength="103.62" lengthAdjust="spacingAndGlyphs">candidates undergo one of</text>
<text x="319.51" y="417.2" font-size="10" textLength="111.71" lengthAdjust="spacingAndGlyphs">the world’s most competitive</text>
<text x="319.51" y="433.2" font-size="10" textLength="107.45" lengthAdjust="spacingAndGlyphs">selection processes. Selected</text>
<text x="319.51" y="449.2" font-size="10" textLength="98.53" lengthAdjust="spacingAndGlyphs">candidates then complete</text>
<text x="319.51" y="465.2" font-size="10" textLength="105.48" lengthAdjust="spacingAndGlyphs">approximately two years of</text>
<text x="319.51" y="481.2" font-size="10" textLength="94.06" lengthAdjust="spacingAndGlyphs">intensive training before</text>
<text x="319.51" y="497.2" font-size="10" textLength="82.19" lengthAdjust="spacingAndGlyphs">beginning specialized</text>
<text x="319.51" y="513.2" font-size="10" textLength="108.28" lengthAdjust="spacingAndGlyphs">mission training. Only then</text>
<text x="319.51" y="529.2" font-size="10" textLength="91.73" lengthAdjust="spacingAndGlyphs">do astronaut candidates</text>
<text x="319.51" y="545.2" font-size="10" textLength="103.85" lengthAdjust="spacingAndGlyphs">become eligible for a flight</text>
<text x="319.47" y="561.2" font-size="10" textLength="97.4" lengthAdjust="spacingAndGlyphs">assignment. During their</text>
<text x="319.47" y="577.2" font-size="10" textLength="92.52" lengthAdjust="spacingAndGlyphs">classroom “boot camp,”</text>
<text x="319.47" y="593.2" font-size="10" textLength="101.24" lengthAdjust="spacingAndGlyphs">candidates are schooled in</text>
<text x="45.01" y="609.2" font-size="10" textLength="384.03" lengthAdjust="spacingAndGlyphs">shuttle and space station systems along with a variety of other disciplines, including Earth sciences,</text>
<text x="45.01" y="625.2" font-size="10" textLength="366.32" lengthAdjust="spacingAndGlyphs">meteorology, space science and engineering. They also train in land and water survival, aircraft</text>
<text x="45.01" y="641.2" font-size="10" textLength="111.01" lengthAdjust="spacingAndGlyphs">operations and scuba diving.</text>
<text x="58.14" y="657.2" font-size="10" textLength="336.77" lengthAdjust="spacingAndGlyphs">Once the candidate training period is complete, new astronauts are given their mission</text>
<text x="45" y="673.2" font-size="10" textLength="357.6" lengthAdjust="spacingAndGlyphs">assignment and grouped with experienced astronauts to continue training. The two types of</text>
<text x="45" y="689.2" font-size="10" textLength="356.29" lengthAdjust="spacingAndGlyphs">astronauts – pilots and mission specialists – perform different functions: pilot astronauts are</text>
<text x="45" y="705.2" font-size="10" textLength="376.31" lengthAdjust="spacingAndGlyphs">assigned to fly the shuttle and command missions, and mission specialists are the flight engineers</text>
</svg>
