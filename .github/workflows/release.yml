name: release

on:
  push:
    tags: ['*']

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read
      # Lets the job mint the OIDC token nuget.org trades for a short-lived publishing key.
      id-token: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      # SponsorCheck bundles the sponsor list during pack on non-PR builds and needs a
      # classic PAT (org secret).
      GitHubToken: ${{ secrets.SPONSOR_CHECK_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The tag is the version: tag 1.2.3 (or v1.2.3) publishes 1.2.3.
      - name: Resolve the version from the tag
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        # Packs as a side effect (GeneratePackageOnBuild), populating ./nugets.
        run: dotnet build src --configuration Release -p:Version=${{ env.version }}

      - name: Test
        run: dotnet run --project src/Morph.PDFium.Tests --configuration Release --no-build -- --report-trx

      - name: Upload snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: received
          path: '**/*.received.*'
          if-no-files-found: ignore

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nugets
          path: nugets/Morph.PDFium.*.nupkg
          if-no-files-found: error

      # Trusted publishing: no stored API key. The key returned is short-lived, so this stays
      # immediately before the push.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: SimonCropp

      - name: Push to nuget.org
        shell: bash
        run: >
          dotnet nuget push nugets/Morph.PDFium.*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
